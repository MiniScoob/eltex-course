@let usernameErrorMessage = getError('username');
@let contentErrorMessage = getError('content');

<form [formGroup]="commentForm" (ngSubmit)="handleSubmit()" class="comment-form">
  @if (!username()) {
    <mat-form-field appearance="outline" class="materialInput">
      <mat-label>Имя (обязательно)</mat-label>
      <input
        matInput
        id="username-input"
        name="username"
        formControlName="username"
        type="text"
        minlength="5"
        size="40"
        required
      />
      @if (usernameErrorMessage) {
        <mat-error class="comment-form__error-message">{{ usernameErrorMessage }}</mat-error>
      }
    </mat-form-field>
  }
  <mat-form-field appearance="outline" class="materialInput">
    <mat-label>Текст (обязательно)</mat-label>
    <textarea
      matInput
      id="content-input"
      name="content"
      formControlName="content"
      minlength="10"
      rows="10"
      cols="40"
      required
    ></textarea>
    @if (contentErrorMessage) {
      <mat-error class="comment-form__error-message">{{ contentErrorMessage }}</mat-error>
    }
  </mat-form-field>
  <div class="comment-form__footer">
    <button
      matButton="filled"
      class="materialButton__filled"
      type="submit"
      [disabled]="commentForm.invalid"
    >
      Добавить
    </button>
    <button
      matButton="outlined"
      class="materialButton__outlined"
      type="reset"
    >
      Очистить
    </button>
  </div>
</form>
